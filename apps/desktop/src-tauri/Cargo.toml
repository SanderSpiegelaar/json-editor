[package]
name = "json-editor"
version = "0.1.0"
description = "A desktop JSON editor powered by Vercel Labs visual-json"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[lib]
name = "json_editor_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
